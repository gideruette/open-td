<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Open TD">
  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="#12141a"/>
  <rect x="36" y="36" width="440" height="440" rx="72" fill="#171a22"/>

  <!-- Crossed swords (attack) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <line x1="156" y1="156" x2="356" y2="356" stroke="#8a6a2a" stroke-width="26"/>
    <line x1="356" y1="156" x2="156" y2="356" stroke="#8a6a2a" stroke-width="26"/>
    <line x1="156" y1="156" x2="356" y2="356" stroke="#ffe08c" stroke-width="14"/>
    <line x1="356" y1="156" x2="156" y2="356" stroke="#ffe08c" stroke-width="14"/>
    <!-- hilts -->
    <circle cx="156" cy="156" r="16" fill="#fff6da" stroke="#8a6a2a" stroke-width="5"/>
    <circle cx="356" cy="156" r="16" fill="#fff6da" stroke="#8a6a2a" stroke-width="5"/>
    <!-- tip flares -->
    <circle cx="356" cy="356" r="8" fill="#ffe08c"/>
    <circle cx="156" cy="356" r="8" fill="#ffe08c"/>
  </g>

  <!-- Defense shield -->
  <path
    d="M256 112 L340 140 V204 C340 260 304 308 256 332 C208 308 172 260 172 204 V140 Z"
    fill="#5fb0ff"
    stroke="#1d4a6b"
    stroke-width="10"
    stroke-linejoin="round"
  />
  <path
    d="M256 146 L308 166 V204 C308 242 288 276 256 292 C224 276 204 242 204 204 V166 Z"
    fill="#142229"
    stroke="#1d4a6b"
    stroke-width="4"
  />

  <!-- Stone fortress -->
  <g stroke="#5c5248" stroke-width="8" stroke-linejoin="round">
    <rect x="172" y="274" width="168" height="124" fill="#9b9086"/>
    <rect x="172" y="222" width="34" height="60" fill="#9b9086"/>
    <rect x="239" y="222" width="34" height="60" fill="#9b9086"/>
    <rect x="306" y="222" width="34" height="60" fill="#9b9086"/>
    <rect x="224" y="320" width="64" height="78" fill="#3a342e" stroke="none"/>
    <path d="M224 320 H288 V372 Q256 402 224 372 Z" fill="#2a241c" stroke="none"/>
    <rect x="192" y="298" width="24" height="24" fill="#3a4a5c" stroke="none"/>
    <rect x="296" y="298" width="24" height="24" fill="#3a4a5c" stroke="none"/>
  </g>

  <rect x="244" y="350" width="14" height="14" rx="3" fill="#ffe08c"/>
</svg>

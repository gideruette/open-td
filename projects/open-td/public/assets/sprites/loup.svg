<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pelt" x1="25%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#b3bcc4"/>
      <stop offset="50%" stop-color="#78838d"/>
      <stop offset="100%" stop-color="#333c46"/>
    </linearGradient>
  </defs>
  <!-- Queue touffue partant de la croupe, recourbée vers le haut -->
  <path
    d="M20 42 C11 44 3 39 3 30 C6 33 9 35 13 35 C16 35 18 36 20 34 Z"
    fill="#6f7a84"
    stroke="#20262c"
    stroke-width="1.3"
  />
  <path d="M6 32 C10 35 15 36 19 35" fill="none" stroke="#e6eaee" stroke-width="1" opacity="0.3"/>
  <!-- Pattes arrière-plan -->
  <g stroke="#3a444e" stroke-width="3.2" stroke-linecap="round">
    <path d="M26 44 L23 54"/>
    <path d="M43 43 L46 54"/>
  </g>
  <g fill="#2b333b">
    <path d="M23 53 L18 56 L26 56 Z"/>
    <path d="M46 53 L42 56 L50 56 Z"/>
  </g>
  <!-- Poitrail profond, dos plongeant vers l'encolure -->
  <path
    d="M17 34 C19 27 27 23 37 25 C45 26 50 31 50 38 C50 45 43 48 33 48 C23 48 17 43 17 34 Z"
    fill="url(#pelt)"
    stroke="#20262c"
    stroke-width="1.6"
  />
  <!-- Pattes avant-plan -->
  <g stroke="#8e99a2" stroke-width="3.2" stroke-linecap="round">
    <path d="M31 46 L30 54"/>
    <path d="M39 46 L39 54"/>
  </g>
  <g fill="#4c565f">
    <path d="M30 53 L26 56 L34 56 Z"/>
    <path d="M39 53 L35 56 L43 56 Z"/>
  </g>
  <!-- Oreille dressée, plaquée en arrière -->
  <path d="M45 30 L47 21 L51 29 Z" fill="#7d8890" stroke="#20262c" stroke-width="1.3"/>
  <!-- Tête portée bas, museau allongé vers l'avant -->
  <path
    d="M44 31 C51 28 57 32 60 37 C61 41 56 44 50 43 C45 42 42 38 43 34 Z"
    fill="#9aa5ad"
    stroke="#20262c"
    stroke-width="1.5"
  />
  <!-- Encolure : sépare la tête de la masse du poitrail -->
  <path d="M44 31 C45 36 45 40 47 43" fill="none" stroke="#20262c" stroke-width="1.1" opacity="0.55"/>
  <path d="M54 35 C57 34 59 36 60 38 L58.5 41.5 C55.5 42 53 40.5 52.5 38.5 Z" fill="#e6eaee" opacity="0.55"/>
  <!-- Oeil bridé, ambré -->
  <path d="M46 35 L51 34.2 L50 37 Z" fill="#e8d97a"/>
  <circle cx="48.4" cy="35.6" r="1" fill="#141a1e"/>
  <circle cx="59.6" cy="37.4" r="1.4" fill="#1a2026"/>
  <!-- Crocs -->
  <path d="M56.5 41.4 L57.5 44.6 L54.8 42.6 Z" fill="#f4f4f0"/>
  <path d="M52 42 L52 45 L50 42.6 Z" fill="#f4f4f0"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fur" x1="20%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#b7a07c"/>
      <stop offset="55%" stop-color="#8a7454"/>
      <stop offset="100%" stop-color="#4a3b24"/>
    </linearGradient>
  </defs>
  <!-- Queue nue, enroulée derrière : donne au premier coup d'oeil la silhouette de rongeur. -->
  <path d="M18 47 C7 50 3 39 9 30" fill="none" stroke="#c08d8d" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M18 47 C7 50 3 39 9 30" fill="none" stroke="#7d5252" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
  <!-- Pattes arrière-plan (plus sombres) puis avant-plan, pour suggérer le volume. -->
  <g stroke="#3a2e1a" stroke-width="2.8" stroke-linecap="round">
    <path d="M24 46 L21 54"/>
    <path d="M40 45 L42 53"/>
  </g>
  <g fill="#3a2e1a">
    <path d="M21 53 L16 56 L24 56 Z"/>
    <path d="M42 52 L39 56 L47 56 Z"/>
  </g>
  <g stroke="#5c4a2e" stroke-width="2.8" stroke-linecap="round">
    <path d="M30 47 L29 54"/>
    <path d="M35 46 L35 54"/>
  </g>
  <!-- Corps voûté, épaules basses -->
  <path
    d="M18 47 C12 43 14 33 23 30 C31 27 40 29 45 35 C49 40 45 49 36 50 C29 51 23 50 18 47 Z"
    fill="url(#fur)"
    stroke="#31281a"
    stroke-width="1.5"
  />
  <path d="M23 32 C30 29 38 30 43 34" fill="none" stroke="#d8c8a8" stroke-width="1" opacity="0.3"/>
  <!-- Oreille ronde, très en arrière du museau -->
  <circle cx="42" cy="28" r="5" fill="#96805e" stroke="#31281a" stroke-width="1.3"/>
  <circle cx="42.6" cy="28.4" r="2.5" fill="#c98f8f"/>
  <!-- Tête effilée en museau -->
  <path
    d="M41 32 C48 30 55 34 57 39 C58 42 53 45 47 44 C42 43 40 39 40 35 Z"
    fill="#a08a66"
    stroke="#31281a"
    stroke-width="1.4"
  />
  <circle cx="47" cy="36.6" r="1.9" fill="#1a1208"/>
  <circle cx="46.4" cy="36" r="0.7" fill="#ffe9c8"/>
  <circle cx="56.4" cy="39.6" r="1.5" fill="#d99a9a"/>
  <!-- Incisive saillante -->
  <path d="M52 42.5 L53.8 46 L50.8 44.2 Z" fill="#f4f0e0"/>
  <g stroke="#efe7d6" stroke-width="0.7" opacity="0.7">
    <path d="M54 42 L61 46"/>
    <path d="M55 40.5 L62 41.5"/>
  </g>
</svg>

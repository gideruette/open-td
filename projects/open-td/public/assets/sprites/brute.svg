<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="skin" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#d09564"/>
      <stop offset="55%" stop-color="#9c5f34"/>
      <stop offset="100%" stop-color="#4a2413"/>
    </linearGradient>
    <linearGradient id="club" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6a42"/>
      <stop offset="100%" stop-color="#4a3420"/>
    </linearGradient>
  </defs>
  <!-- Gourdin traîné derrière : allonge la silhouette vers la gauche -->
  <path d="M18 44 L6 54" stroke="url(#club)" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M8 52 L4 58" stroke="#3a2618" stroke-width="7" stroke-linecap="round"/>
  <path d="M6 55 L2 57" stroke="#dcd2c0" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Jambes trapues, presque écrasées par la masse au-dessus -->
  <path d="M27 45 L25 52" stroke="#7d4a28" stroke-width="8" stroke-linecap="round"/>
  <path d="M39 45 L41 52" stroke="#8f5730" stroke-width="8" stroke-linecap="round"/>
  <path d="M25 51 L17 57 L30 57 Z" fill="#3a2618"/>
  <path d="M41 51 L36 57 L49 57 Z" fill="#452c1c"/>
  <!-- Bras démesurés, poings au niveau des genoux -->
  <path d="M15 28 L11 43" stroke="#9c5f34" stroke-width="8" stroke-linecap="round"/>
  <path d="M49 28 L52 43" stroke="#ab6a3c" stroke-width="8" stroke-linecap="round"/>
  <circle cx="11" cy="45" r="5" fill="#8f5730" stroke="#3a1c0c" stroke-width="1.3"/>
  <circle cx="52" cy="45" r="5" fill="#a0653a" stroke="#3a1c0c" stroke-width="1.3"/>
  <!-- Épaules énormes, taille étroite : la masse est en haut -->
  <path
    d="M14 26 C18 16 46 16 50 26 L47 42 C38 47 26 47 17 42 Z"
    fill="url(#skin)"
    stroke="#3a1c0c"
    stroke-width="1.7"
  />
  <path d="M22 25 C26 30 38 30 42 25" fill="none" stroke="#4a2413" stroke-width="1.6" opacity="0.5"/>
  <!-- Cicatrices sur le pectoral -->
  <g stroke="#e0b48c" stroke-width="1" opacity="0.45">
    <path d="M20 32 L30 38"/>
    <path d="M24 30 L33 37"/>
  </g>
  <!-- Petite tête enfoncée entre les épaules : contraste qui fait la brute -->
  <path
    d="M32 8 C38 8 41 12 41 17 C41 22 37 24 32 24 C27 24 23 22 23 17 C23 12 26 8 32 8 Z"
    fill="url(#skin)"
    stroke="#3a1c0c"
    stroke-width="1.4"
  />
  <path d="M24 16 L30.5 18.2 L30 20.4 L24.5 18.6 Z" fill="#3a1c0c" opacity="0.85"/>
  <path d="M40 16 L33.5 18.2 L34 20.4 L39.5 18.6 Z" fill="#3a1c0c" opacity="0.85"/>
  <path d="M26 19 L30 20 L26 21.4 Z" fill="#ffd0a0"/>
  <path d="M38 19 L34 20 L38 21.4 Z" fill="#ffd0a0"/>
  <!-- Mâchoire serrée, dents visibles -->
  <path d="M27 22 L37 22 L36 24.6 L28 24.6 Z" fill="#1c1008"/>
  <g stroke="#f0ecd8" stroke-width="1.1">
    <path d="M30 22 L30 24.4"/>
    <path d="M34 22 L34 24.4"/>
  </g>
</svg>

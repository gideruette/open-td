<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shroud" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3c4a34"/>
      <stop offset="55%" stop-color="#1c2418"/>
      <stop offset="100%" stop-color="#0a0e08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4ff7a"/>
      <stop offset="60%" stop-color="#8fcf3a"/>
      <stop offset="100%" stop-color="#3a6a1a"/>
    </radialGradient>
    <radialGradient id="hoodInner" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#0f140c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <!-- Silhouette en linceul déchiqueté : très différente de la tête ronde + oreilles des humanoïdes -->
  <path
    d="M32 4
       C 22 4 16 12 15 22
       C 10 26 6 34 9 42
       L 4 46 L 12 47
       L 8 56 L 18 50
       L 20 60 L 26 52
       L 32 62 L 38 52
       L 44 60 L 46 50
       L 56 56 L 52 47
       L 60 46 L 55 42
       C 58 34 54 26 49 22
       C 48 12 42 4 32 4 Z"
    fill="url(#shroud)"
    stroke="#040703"
    stroke-width="1.4"
  />
  <!-- Capuche : ouverture sombre où flottent les yeux, sans contour de crâne visible -->
  <ellipse cx="32" cy="26" rx="15" ry="16" fill="url(#hoodInner)"/>
  <circle cx="26" cy="27" r="3.4" fill="url(#glow)"/>
  <circle cx="38" cy="27" r="3.4" fill="url(#glow)"/>
  <circle cx="26" cy="27" r="1.1" fill="#eaffc8"/>
  <circle cx="38" cy="27" r="1.1" fill="#eaffc8"/>
  <!-- Filet de bave/ichor sous la capuche -->
  <path d="M31 34 Q32 40 30 46" stroke="#8fcf3a" stroke-width="1.4" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- Côtes entr'aperçues sous le linceul déchiré -->
  <path d="M22 40 Q32 44 42 40" stroke="#0a0e08" stroke-width="1.6" fill="none" opacity="0.6"/>
  <path d="M23 45 Q32 49 41 45" stroke="#0a0e08" stroke-width="1.6" fill="none" opacity="0.5"/>
  <!-- Lueur ambiante (particules nécrotiques) -->
  <circle cx="12" cy="38" r="1.6" fill="#d4ff7a" opacity="0.7"/>
  <circle cx="52" cy="36" r="1.3" fill="#d4ff7a" opacity="0.6"/>
  <circle cx="32" cy="8" r="1.4" fill="#d4ff7a" opacity="0.6"/>
</svg>

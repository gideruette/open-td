<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shroud" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#44543a"/>
      <stop offset="55%" stop-color="#1c2418"/>
      <stop offset="100%" stop-color="#080b06"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e4ffb0"/>
      <stop offset="55%" stop-color="#8fcf3a"/>
      <stop offset="100%" stop-color="#3a6a1a"/>
    </radialGradient>
  </defs>
  <!-- Bras décharnés, très longs, griffes vers le sol -->
  <path d="M20 26 L10 42" stroke="#2c3826" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M44 26 L54 42" stroke="#2c3826" stroke-width="3.4" stroke-linecap="round"/>
  <g stroke="#cfe0b0" stroke-width="1.3" stroke-linecap="round">
    <path d="M10 42 L6 50"/>
    <path d="M10 42 L10 51"/>
    <path d="M10 42 L14 49"/>
    <path d="M54 42 L58 50"/>
    <path d="M54 42 L54 51"/>
    <path d="M54 42 L50 49"/>
  </g>
  <!-- Linceul déchiqueté, sans jambes visibles : la silhouette flotte -->
  <path
    d="M32 12 C22 12 18 20 19 28 C14 34 12 42 14 50
       L10 56 L18 53 L20 60 L25 52 L28 62 L32 53 L36 62 L39 52 L44 60 L46 53 L54 56 L50 50
       C52 42 50 34 45 28 C46 20 42 12 32 12 Z"
    fill="url(#shroud)"
    stroke="#040703"
    stroke-width="1.4"
  />
  <!-- Cage thoracique entrevue sous le tissu -->
  <g fill="none" stroke="#0a0e08" stroke-width="1.5" opacity="0.65">
    <path d="M23 36 C28 40 36 40 41 36"/>
    <path d="M22 42 C27 46 37 46 42 42"/>
    <path d="M24 30 C28 33 36 33 40 30"/>
  </g>
  <!-- Capuche : ouverture noire d'où émergent deux fentes luisantes -->
  <path
    d="M32 8 C40 8 45 14 44 22 C40 27 24 27 20 22 C19 14 24 8 32 8 Z"
    fill="url(#shroud)"
    stroke="#040703"
    stroke-width="1.4"
  />
  <path d="M22 18 C26 15 38 15 42 18 C39 24 25 24 22 18 Z" fill="#020401"/>
  <path d="M25 19 L31 20.4 L25 21.6 Z" fill="url(#glow)"/>
  <path d="M39 19 L33 20.4 L39 21.6 Z" fill="url(#glow)"/>
  <!-- Filet d'ichor + particules nécrotiques -->
  <path d="M31 26 Q32 32 30 38" fill="none" stroke="#8fcf3a" stroke-width="1.3" opacity="0.65" stroke-linecap="round"/>
  <g fill="#d4ff7a">
    <circle cx="12" cy="30" r="1.5" opacity="0.65"/>
    <circle cx="52" cy="32" r="1.2" opacity="0.6"/>
    <circle cx="32" cy="4" r="1.3" opacity="0.55"/>
  </g>
</svg>

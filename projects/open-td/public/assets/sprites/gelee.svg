<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="jelly" cx="35%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#b8ecf4" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#3aa7bd" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#12505f" stop-opacity="0.92"/>
    </radialGradient>
    <radialGradient id="nucleus" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8ff0ff"/>
      <stop offset="100%" stop-color="#0d3540"/>
    </radialGradient>
  </defs>
  <!-- Masse molle, base étalée : pas de tête, donc pas de visage à confondre avec un smiley. -->
  <path
    d="M32 12 C42 12 48 20 47 28 C46 34 52 38 52 44 C52 52 43 56 32 56 C21 56 12 52 12 44
       C12 38 18 34 17 28 C16 20 22 12 32 12 Z"
    fill="url(#jelly)"
    stroke="#0d3540"
    stroke-width="1.6"
  />
  <!-- Coulures qui débordent de la base -->
  <path d="M14 50 C10 53 10 58 14 58 C17 58 18 54 17 51 Z" fill="url(#jelly)" stroke="#0d3540" stroke-width="1.2"/>
  <path d="M49 48 C53 50 54 55 51 56 C48 57 47 53 47 50 Z" fill="url(#jelly)" stroke="#0d3540" stroke-width="1.2"/>
  <!-- Deux noyaux déjà distincts : annonce visuellement la scission à la mort. -->
  <ellipse cx="25" cy="36" rx="5.2" ry="6" fill="url(#nucleus)" opacity="0.9"/>
  <ellipse cx="39" cy="42" rx="4.4" ry="5" fill="url(#nucleus)" opacity="0.85"/>
  <path d="M28 30 C32 34 32 44 36 48" fill="none" stroke="#0d3540" stroke-width="1.1" opacity="0.4"/>
  <!-- Bulles + reflet spéculaire -->
  <g fill="#e8ffff">
    <circle cx="20" cy="46" r="2.2" opacity="0.5"/>
    <circle cx="43" cy="30" r="1.6" opacity="0.45"/>
    <circle cx="34" cy="52" r="1.3" opacity="0.4"/>
  </g>
  <path d="M22 20 C26 15 32 14 36 16 C31 17 27 20 25 24 Z" fill="#ffffff" opacity="0.55"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cloak" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5a4664"/>
      <stop offset="55%" stop-color="#2e2138"/>
      <stop offset="100%" stop-color="#120c18"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2c0"/>
      <stop offset="55%" stop-color="#ffb066"/>
      <stop offset="100%" stop-color="#c03a10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Bombe à mèche brandie : l'objet le plus lisible du sprite (6 dégâts au château). -->
  <path d="M49 12 C53 8 50 5 47 6" fill="none" stroke="#8a6a3a" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="46" cy="5" r="4" fill="url(#spark)"/>
  <circle cx="46" cy="5" r="1.6" fill="#fff6de"/>
  <circle cx="49" cy="16" r="6" fill="#2a2420" stroke="#0e0a08" stroke-width="1.3"/>
  <circle cx="47" cy="14" r="1.8" fill="#6a6058" opacity="0.7"/>
  <!-- Jambes en pas de course -->
  <path d="M28 42 L22 52" stroke="#2e2138" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M36 42 L42 50" stroke="#3a2b46" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M22 51 L16 55 L24 56 Z" fill="#120c18"/>
  <path d="M42 49 L46 54 L38 54 Z" fill="#170f1e"/>
  <!-- Cape fuyante vers l'arrière -->
  <path
    d="M28 20 C18 24 10 34 6 48 C14 46 20 44 24 40 C22 34 24 26 28 20 Z"
    fill="url(#cloak)"
    stroke="#0a0610"
    stroke-width="1.3"
  />
  <!-- Bras tendu vers la bombe -->
  <path d="M36 26 L45 18" stroke="#3a2b46" stroke-width="4" stroke-linecap="round"/>
  <!-- Buste fin, penché en avant -->
  <path
    d="M26 20 C30 17 38 18 39 22 L41 40 C35 44 28 44 24 40 Z"
    fill="url(#cloak)"
    stroke="#0a0610"
    stroke-width="1.4"
  />
  <path d="M25 30 L41 33" fill="none" stroke="#6a5a2a" stroke-width="1.6" opacity="0.8"/>
  <!-- Capuche pointue rabattue : visage dans l'ombre, une seule fente lumineuse -->
  <path
    d="M32 6 C39 7 43 13 42 20 C38 24 27 24 24 20 C23 13 26 7 32 6 Z"
    fill="url(#cloak)"
    stroke="#0a0610"
    stroke-width="1.4"
  />
  <path d="M26 17 C30 15 36 15 40 17 C37 21 29 21 26 17 Z" fill="#050308"/>
  <path d="M28.5 17.6 L34 18.6 L28.5 19.6 Z" fill="#ff8a5a"/>
  <path d="M38.5 18 L35.5 18.6 L38.5 19.4 Z" fill="#ff8a5a" opacity="0.8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="stone" x1="10%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#b4b6b2"/>
      <stop offset="50%" stop-color="#878783"/>
      <stop offset="100%" stop-color="#50504c"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c8c88"/>
      <stop offset="100%" stop-color="#454541"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0c8"/>
      <stop offset="45%" stop-color="#ffb066"/>
      <stop offset="100%" stop-color="#c04e18"/>
    </radialGradient>
  </defs>
  <!-- Jambes-blocs -->
  <path d="M22 44 L32 44 L31 57 L20 57 Z" fill="url(#stoneDark)" stroke="#3c3c38" stroke-width="1.6"/>
  <path d="M34 44 L44 44 L46 57 L35 57 Z" fill="url(#stoneDark)" stroke="#3c3c38" stroke-width="1.6"/>
  <!-- Bras en moellons empilés, poings au sol -->
  <path d="M12 22 L20 20 L22 38 L13 40 Z" fill="url(#stoneDark)" stroke="#3c3c38" stroke-width="1.5"/>
  <path d="M52 22 L44 20 L42 38 L51 40 Z" fill="url(#stoneDark)" stroke="#3c3c38" stroke-width="1.5"/>
  <path d="M8 38 L22 36 L23 49 L9 50 Z" fill="url(#stone)" stroke="#3c3c38" stroke-width="1.6"/>
  <path d="M56 38 L42 36 L41 49 L55 50 Z" fill="url(#stone)" stroke="#3c3c38" stroke-width="1.6"/>
  <!-- Tronc taillé à la serpe, épaules en escalier -->
  <path
    d="M20 16 L44 16 L48 30 L44 46 L20 46 L16 30 Z"
    fill="url(#stone)"
    stroke="#3c3c38"
    stroke-width="1.8"
  />
  <!-- Fissures traversées de magma : la source de lumière est le torse, pas les yeux -->
  <path d="M24 20 L30 27 L26 33 L33 42" fill="none" stroke="#3c3c38" stroke-width="2.4"/>
  <path d="M24 20 L30 27 L26 33 L33 42" fill="none" stroke="#ffb066" stroke-width="1.1" opacity="0.85"/>
  <path d="M40 22 L36 30 L42 36" fill="none" stroke="#3c3c38" stroke-width="2"/>
  <path d="M40 22 L36 30 L42 36" fill="none" stroke="#ff8a3a" stroke-width="0.9" opacity="0.7"/>
  <circle cx="32" cy="32" r="5.5" fill="url(#core)"/>
  <circle cx="32" cy="32" r="2.2" fill="#fff6de"/>
  <!-- Mousse accrochée aux flancs -->
  <path d="M17 40 C21 37 25 38 26 41 C22 43 19 43 17 40 Z" fill="#5c7a3a" opacity="0.75"/>
  <path d="M44 18 C47 17 50 18 50 20 C47 21 45 21 44 18 Z" fill="#5c7a3a" opacity="0.6"/>
  <!-- Tête réduite à un bloc coiffant les épaules, avec une seule fente lumineuse -->
  <path d="M25 4 L41 5 L43 16 L23 16 Z" fill="url(#stone)" stroke="#3c3c38" stroke-width="1.7"/>
  <path d="M26 10 L40 10.6 L40 13 L26 12.6 Z" fill="#241a12"/>
  <path d="M27.5 11 L38.5 11.5 L38.5 12.4 L27.5 12 Z" fill="#ffb066"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="skin" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#8dbb5e"/>
      <stop offset="55%" stop-color="#5c8a3a"/>
      <stop offset="100%" stop-color="#24350f"/>
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a5136"/>
      <stop offset="100%" stop-color="#33251a"/>
    </linearGradient>
  </defs>
  <!-- Hache d'armes : manche vertical passant dans le poing droit, fer en croissant (lisible même en 35 px) -->
  <path d="M55 12 L51 48" stroke="#4a3a26" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M55 12 L51 48" stroke="#8a6a42" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <path d="M54 15 C62 18 62 30 52 33 C56 27 56 20 54 15 Z" fill="#c6ced8" stroke="#6f7883" stroke-width="1.1"/>
  <path d="M54 15 C58 18 58 28 52 33 C55 27 55 20 54 15 Z" fill="#ffffff" opacity="0.28"/>
  <!-- Jambes courtes et massives -->
  <path d="M27 44 L25 52" stroke="#3d5c22" stroke-width="7" stroke-linecap="round"/>
  <path d="M38 44 L40 52" stroke="#4c7029" stroke-width="7" stroke-linecap="round"/>
  <path d="M25 51 L18 56 L29 56 Z" fill="#33251a"/>
  <path d="M40 51 L36 56 L47 56 Z" fill="#3d2d1f"/>
  <!-- Bras épais, mains sous la taille -->
  <path d="M19 30 L14 44" stroke="#5c8a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M45 30 L50 39" stroke="#6a9c44" stroke-width="6" stroke-linecap="round"/>
  <circle cx="13" cy="45" r="3.6" fill="#4c7029" stroke="#24350f" stroke-width="1.1"/>
  <circle cx="51.4" cy="40.8" r="3.8" fill="#5c8a3a" stroke="#24350f" stroke-width="1.1"/>
  <!-- Torse en trapèze : très large aux épaules, serré aux hanches -->
  <path
    d="M20 27 C22 22 42 22 44 27 L46 40 C38 45 26 45 18 40 Z"
    fill="url(#skin)"
    stroke="#1e2c0c"
    stroke-width="1.6"
  />
  <!-- Sangle de cuir en travers du torse -->
  <path d="M22 27 L44 40 L42 43 L20 30 Z" fill="url(#leather)" stroke="#1e2c0c" stroke-width="0.9"/>
  <!-- Tête enfoncée dans les épaules, mâchoire proéminente -->
  <path
    d="M32 6 C39 6 43 11 43 16 C43 22 38 26 32 26 C26 26 21 22 21 16 C21 11 25 6 32 6 Z"
    fill="url(#skin)"
    stroke="#1e2c0c"
    stroke-width="1.5"
  />
  <!-- Deux arcades séparées plutôt qu'un bandeau plein : évite l'effet « masque ». -->
  <path d="M22.5 15.5 L30 17.6 L29.5 19.8 L23 18 Z" fill="#1e2c0c" opacity="0.8"/>
  <path d="M41.5 15.5 L34 17.6 L34.5 19.8 L41 18 Z" fill="#1e2c0c" opacity="0.8"/>
  <!-- Yeux enfoncés, réduits à deux fentes rouges -->
  <path d="M24 18 L29 19 L24 20.6 Z" fill="#ff8a5a"/>
  <path d="M40 18 L35 19 L40 20.6 Z" fill="#ff8a5a"/>
  <!-- Mâchoire inférieure + défenses tournées vers le haut : signature de l'orc.
       Les pointes restent sous la ligne des yeux (y ≈ 21) pour ne pas passer devant le regard. -->
  <path d="M24 22 C27 25 37 25 40 22 L39 25 C36 27 28 27 25 25 Z" fill="#1c2a10"/>
  <path d="M25.5 25.4 L21 21.4 L28 23.6 Z" fill="#f0ecd8" stroke="#c8c2a4" stroke-width="0.6"/>
  <path d="M38.5 25.4 L43 21.4 L36 23.6 Z" fill="#f0ecd8" stroke="#c8c2a4" stroke-width="0.6"/>
</svg>

<button
  type="button"
  class="otd-item-button"
  [class.otd-item-button--selected]="selected()"
  [disabled]="disabled()"
  (click)="clicked.emit($event)"
>
  <img class="otd-item-button__sprite" [src]="spriteSrc()" alt="" />
  <span class="otd-item-button__name">{{ label() }}</span>
  <span class="otd-item-button__meta">{{ meta() }}</span>
</button>

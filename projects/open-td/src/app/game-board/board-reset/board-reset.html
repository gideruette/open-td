<button
  type="button"
  class="board-reset"
  [disabled]="disabled()"
  [attr.aria-label]="label()"
  [title]="label()"
  (click)="onClick()"
>
  <svg
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3 6h18" />
    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
    <path d="M10 11v6" />
    <path d="M14 11v6" />
  </svg>
</button>

@if (open()) {
  <div class="board-reset-overlay" (click)="onCancel()">
    <div
      class="board-reset-dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="board-reset-title"
      (click)="$event.stopPropagation()"
    >
      <h2 id="board-reset-title" class="board-reset-dialog__title">{{ label() }} ?</h2>
      <p class="board-reset-dialog__body">Cette action est irréversible.</p>
      <div class="board-reset-dialog__actions">
        <otd-button size="sm" (clicked)="onCancel()">Annuler</otd-button>
        <otd-button variant="danger" size="sm" (clicked)="onConfirm()">Confirmer</otd-button>
      </div>
    </div>
  </div>
}

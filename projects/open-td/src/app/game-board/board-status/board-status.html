<header class="board-status" aria-live="polite">
  <div class="board-status__row">
    <img
      class="board-status__icon"
      [src]="
        phase() === 'defense'
          ? 'assets/sprites/shield-defense.svg'
          : 'assets/sprites/swords-attack.svg'
      "
      alt=""
    />
    <span class="board-status__title">
      Palier {{ palier() }} · {{ phase() === 'defense' ? 'Défense' : 'Attaque' }}
    </span>
    <span class="board-status__budget">
      <img
        class="board-status__budget-icon"
        [src]="
          phase() === 'defense'
            ? 'assets/sprites/budget-defense.svg'
            : 'assets/sprites/budget-attack.svg'
        "
        alt=""
      />
      {{ budget().remaining }}/{{ budget().total }}
    </span>
  </div>

  <div class="board-status__actions">
    <otd-board-reset [disabled]="trialRunning()" [label]="resetLabel()" (confirm)="onReset()" />
    <otd-board-launch />
  </div>
</header>

<section
  class="board"
  [class.board--attack]="phase() === 'attack'"
  [class.board--pan]="boardTool() === 'pan'"
  [class.board--edit]="boardTool() === 'edit'"
>
  <div class="board__stage">
    <div class="board__map">
      <div
        #viewport
        class="board__canvas-wrap"
        [class.board__canvas-wrap--panning]="isPanning()"
        (pointerdown)="onViewPointerDown($event)"
        (pointermove)="onViewPointerMove($event)"
        (pointerup)="onViewPointerUp($event)"
        (pointercancel)="onViewPointerUp($event)"
        (contextmenu)="$event.preventDefault()"
        (mouseleave)="onCanvasLeave()"
      >
        <canvas #board class="board__canvas" [style.transform]="viewTransform()"></canvas>
        @if (boardTooltip(); as tooltip) {
          <otd-tooltip
            class="board__tooltip"
            [style.left.px]="tooltip.left"
            [style.top.px]="tooltip.top"
            [heading]="tooltip.heading"
            [description]="tooltip.description"
            [stats]="tooltip.stats"
          ></otd-tooltip>
        }
      </div>

      <otd-board-status [phase]="phase()" [palier]="palier()" [vagueCourante]="vagueCourante()" />

      <otd-board-sheet
        sheetId="board-targeting"
        [open]="targetingOpen()"
        [title]="phase() === 'defense' ? (selectedTower()?.typeId ?? 'Tour') : activeLaneLabel()"
        [ariaLabel]="phase() === 'defense' ? 'Tour sélectionnée' : 'Voie sélectionnée'"
        (closed)="closeTargeting()"
      >
        @if (phase() === 'defense') {
          <otd-tower-actions
            [tower]="selectedTower()"
            [moving]="isMovingTower()"
            [trialRunning]="isTrialRunning()"
            (startMove)="startMovingTower()"
            (cancelMove)="cancelMovingTower()"
            (remove)="deleteSelected()"
            (reset)="resetDefenseSession()"
          />
        } @else {
          <otd-lanes-panel
            [lane]="activeLane()"
            [laneIndex]="activeLaneIndex()"
            [trialRunning]="isTrialRunning()"
            [attackBudgetRemaining]="getAttackBudgetRemaining()"
            (laneRename)="renameActiveLane($event)"
            (laneRemove)="removeActiveLane()"
            (laneRetrace)="retraceActiveLane()"
            (monsterAppend)="appendMonster($event)"
            (unitMove)="moveActiveQueueUnit($event.unitIndex, $event.delta)"
            (unitRemove)="removeActiveQueueUnit($event)"
          />
        }
      </otd-board-sheet>

      @if (targetingOpen()) {
        <button
          type="button"
          class="board__sheet-backdrop"
          aria-label="Fermer le menu"
          (click)="closeDrawers()"
        ></button>
      }
    </div>

    <otd-board-hud
      [phase]="phase()"
      [trialRunning]="isTrialRunning()"
      [drawingPath]="isDrawingPath()"
      [remainingBudget]="remainingBudget()"
      [defenseBudgetTotal]="defenseBudgetTotal()"
      [attackBudgetRemaining]="getAttackBudgetRemaining()"
      [attackBudgetTotal]="attackBudgetTotal()"
      [chateauHp]="trialChateauHp() ?? chateauMaxHp()"
      [chateauMaxHp]="chateauMaxHp()"
      [breachCount]="trialBreachCount() ?? 0"
      [selectedTypeId]="selectedTypeId()"
      [lanes]="lanes()"
      [activeLaneIndex]="activeLaneIndex()"
      [targetingOpen]="targetingOpen()"
      [canLaunch]="canLaunch()"
      [message]="message()"
      (towerTypeSelect)="selectTowerType($event)"
      (laneSelect)="selectLane($event)"
      (startTracing)="startTracing()"
      (undoTracePoint)="undoLastTracePoint()"
      (cancelTracing)="cancelTracing()"
      (targetingToggle)="toggleTargeting()"
      (launch)="onLaunch()"
    />
  </div>
</section>
